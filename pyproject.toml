[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdraw"
version = "0.1.0"
description = "Single-user Qwen3.6-35B-A3B-NVFP4 inference library for one RTX 5090"
requires-python = ">=3.11"
dependencies = [
    "nvidia-cutlass-dsl>=4.7.1",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quickdraw*"]
